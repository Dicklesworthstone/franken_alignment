[workspace]
members = ["crates/fa-reference", "crates/fa-journal", "xtask"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false
license-file = "LICENSE"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
bool_assert_comparison = "allow"
chunks_exact_to_as_chunks = "allow"
clone_on_copy = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
derivable_impls = "allow"
drop_non_drop = "allow"
duplicate_mod = "allow"
duplicated_attributes = "allow"
field_reassign_with_default = "allow"
large_enum_variant = "allow"
manual_clamp = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
manual_range_patterns = "allow"
map_clone = "allow"
module_inception = "allow"
needless_bool = "allow"
op_ref = "allow"
redundant_closure = "allow"
result_large_err = "allow"
single_match = "allow"
single_range_in_vec_init = "allow"
sliced_string_as_bytes = "allow"
too_many_arguments = "allow"
unnecessary_unwrap = "allow"
useless_vec = "allow"
write_with_newline = "allow"
zombie_processes = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
