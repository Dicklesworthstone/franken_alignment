[workspace]
members = ["crates/fa-reference", "crates/fa-journal", "xtask"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
